<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <!-- left baby foot -->
    <symbol id="lf" viewBox="-30 -44 60 84">
      <path d="M -1 36 C -13 36, -22 28, -23 16 C -24 6, -23 -3, -21 -10 C -19 -16, -10 -20, -1 -20 C 9 -20, 17 -17, 20 -10 C 23 -3, 23 7, 21 16 C 20 28, 11 36, -1 36 Z"/>
      <ellipse cx="-20" cy="-28" rx="7" ry="9" transform="rotate(-20 -20 -28)"/>
      <ellipse cx="-9" cy="-34" rx="5" ry="6.8" transform="rotate(-10 -9 -34)"/>
      <ellipse cx="1" cy="-36" rx="4.6" ry="6.4"/>
      <ellipse cx="10" cy="-34" rx="4.2" ry="5.8" transform="rotate(10 10 -34)"/>
      <ellipse cx="17" cy="-30" rx="3.7" ry="5.2" transform="rotate(22 17 -30)"/>
    </symbol>
    <!-- gradient for heart outline (left half blue, right half sage) -->
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"  stop-color="#2A6B88"/>
      <stop offset=".5" stop-color="#2A6B88"/>
      <stop offset=".5" stop-color="#5C8B6F"/>
      <stop offset="1"  stop-color="#5C8B6F"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="240" height="240" rx="50" fill="#F4F3F0"/>

  <!-- heart halves filled with pastel tints -->
  <path d="M 120 215 C 30 155, 12 80, 50 45 C 75 25, 105 32, 120 60 L 120 215 Z" fill="#E7F2F8"/>
  <path d="M 120 215 L 120 60 C 135 32, 165 25, 190 45 C 228 80, 210 155, 120 215 Z" fill="#E7EFE9"/>

  <!-- heart outline with split gradient -->
  <path d="M 120 215 C 30 155, 12 80, 50 45 C 75 25, 105 32, 120 60 C 135 32, 165 25, 190 45 C 228 80, 210 155, 120 215 Z"
        fill="none" stroke="url(#grad)" stroke-width="5"/>

  <!-- Lev's foot (blue) -->
  <g fill="#2A6B88"><use href="#lf" x="46" y="62" width="78" height="128"/></g>

  <!-- Mark's foot (sage) -->
  <g fill="#5C8B6F"><use href="#lf" x="116" y="62" width="78" height="128"/></g>

  <!-- L and M letters on the soles -->
  <text x="85" y="150" font-family="Inter, -apple-system, system-ui, sans-serif"
        font-size="36" font-weight="800" fill="white" text-anchor="middle">L</text>
  <text x="155" y="150" font-family="Inter, -apple-system, system-ui, sans-serif"
        font-size="36" font-weight="800" fill="white" text-anchor="middle">M</text>
</svg>
